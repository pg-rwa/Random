# BTC Micro-Trading Bot v5 Configuration
# Pattern-based strategies + SQLite database
# Paper trading on mainnet prices — no real money at risk

symbol: "BTC"
interval: "1m"
candle_limit: 100
loop_interval_seconds: 20
leverage: 5
db_path: "btc_trades/btc_micro.db"

# Strategy parameters — proven pattern-based strategies
strategy:
  # Minimum confidence to act on any strategy signal
  min_confidence: 0.50

  # ATR volatility gate — skip entries when too volatile
  max_atr_pct: 0.3

  # EMA periods (used by all strategies for trend context)
  ema_fast: 8
  ema_slow: 21
  ema_trend: 50
  rsi_period: 14
  bb_period: 20
  bb_std: 2.0

  # Exit thresholds
  exit_rsi_long: 75              # Exit longs when RSI > this
  exit_rsi_short: 25             # Exit shorts when RSI < this

  # --- VWAP Reclaim Strategy ---
  enable_vwap_reclaim: true
  vwap_min_volume_ratio: 1.2     # Volume must be 1.2x average
  vwap_min_deviation_pct: 0.03   # Minimum deviation from VWAP
  vwap_max_deviation_pct: 0.15   # Max deviation (not too stretched)

  # --- Fair Value Gap (FVG) Strategy ---
  enable_fvg: true
  fvg_min_gap_pct: 0.03          # Minimum gap size (% of price)
  fvg_max_gap_pct: 0.25          # Max gap size
  fvg_lookback: 15               # How many candles back to scan for FVGs

  # --- Break of Structure (BOS) Strategy ---
  enable_bos: true
  bos_swing_lookback: 10         # Candles to look back for swing points
  bos_min_break_pct: 0.02        # Minimum break distance
  bos_max_break_pct: 0.15        # Max break distance (not a wick spike)
  bos_volume_confirm: 1.1        # Volume confirmation for breaks

  # --- EMA Pullback Strategy ---
  enable_ema_pullback: true
  ema_touch_tolerance_pct: 0.04  # How close price must get to EMA21
  ema_rsi_upper: 70              # Don't buy when RSI this high
  ema_rsi_lower: 30              # Don't short when RSI this low

# Executor parameters — micro-trade sizing & risk
executor:
  tp_pct: 0.15                   # Take-profit target
  sl_pct: 0.12                   # Stop-loss
  position_size_usd: 40.0        # $40 x 5x = $200 notional per trade
  max_consecutive_losses: 4      # Pause after 4 losses
  cooldown_after_losses_sec: 120
  daily_loss_limit_pct: 2.0
  direction_cooldown_sec: 45
  max_trades_per_hour: 30

  # ATR-based dynamic stops
  use_atr_stops: true
  atr_tp_mult: 2.5               # TP = 2.5x ATR
  atr_sl_mult: 1.8               # SL = 1.8x ATR

  # Trailing stop
  trailing_stop_activate_pct: 0.10
  trailing_stop_distance_pct: 0.06

  # Circuit breakers
  session_drawdown_limit_pct: 3.0
  per_direction_loss_limit: 3
  per_direction_cooldown_sec: 120
  scale_size_on_streak: true
