# BTC Momentum Configuration
# Tuned for BTC perpetual futures on Hyperliquid

symbols:
  - BTC

interval: "5m"
candle_limit: 100
loop_interval_seconds: 30
leverage: 3

# Indicator parameters
indicators:
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  volume_sma_period: 20

# Strategy parameters
strategy:
  rsi_buy_min: 50
  rsi_buy_max: 75
  rsi_sell_min: 25
  rsi_sell_max: 50
  volume_threshold: 1.3
  min_confidence: 0.60
  rsi_exit_long_below: 45
  rsi_exit_short_above: 55
  weights:
    ema_trend: 0.20
    ema_cross: 0.15
    rsi_zone: 0.20
    macd_accel: 0.20
    volume: 0.15
    vwap: 0.10

# Risk parameters
risk:
  max_risk_per_trade_pct: 1.0
  max_consecutive_losses: 3
  cooldown_seconds: 3600
  daily_loss_limit_pct: 5.0
  max_open_positions: 3
  trailing_stop_atr_mult: 1.5
