# Gold Scalper v5 Configuration
# Session-aware pattern-based strategies + SQLite database
# Paper trading on mainnet prices

symbol: "xyz:GOLD"
interval: "1m"
candle_limit: 100
loop_interval_seconds: 60
leverage: 10
db_path: "gold_trades/gold_scalper.db"

# Strategy parameters — session-aware, pattern-based
strategy:
  # Minimum confidence to act on any strategy signal
  min_confidence: 0.50

  # ATR volatility gate — skip entries in chaos
  max_atr_pct: 0.5

  # Indicator periods (used by all strategies)
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50
  rsi_period: 14
  bb_period: 20
  bb_std: 2.0

  # Exit thresholds
  exit_rsi_long: 75
  exit_rsi_short: 25

  # --- Asian Range Breakout (London open) ---
  enable_asian_breakout: true
  asian_min_range_pct: 0.05        # Min Asian range (% of price)
  asian_max_range_pct: 0.40        # Max (too wide = news event, skip)
  asian_breakout_buffer_pct: 0.01  # Buffer above/below range for entry
  asian_volume_confirm: 1.1        # Volume > 1.1x avg to confirm break

  # --- Liquidity Sweep (round number stop-hunts) ---
  enable_liquidity_sweep: true
  sweep_round_increment: 5.0       # Gold round numbers at $5 increments
  sweep_wick_min_pct: 0.02         # Min sweep depth (% of price)
  sweep_lookback: 5                # Candles to scan for sweep pattern
  sweep_volume_confirm: 1.15       # Higher volume confirms institutional activity

  # --- Session VWAP Reclaim ---
  enable_session_vwap: true
  vwap_min_volume_ratio: 1.2       # Volume > 1.2x avg
  vwap_max_deviation_pct: 0.12     # Not too far from VWAP

  # --- EMA Pullback (trend continuation) ---
  enable_ema_pullback: true
  ema_touch_tolerance_pct: 0.04    # How close price must get to EMA21
  ema_rsi_upper: 70                # Don't buy when RSI > 70
  ema_rsi_lower: 30                # Don't short when RSI < 30

# Executor parameters
executor:
  tp_pct: 0.14
  sl_pct: 0.14
  position_size_usd: 100.0        # $100 x 10x = $1000 notional
  max_consecutive_losses: 5
  cooldown_after_losses_sec: 300
  daily_loss_limit_pct: 3.0
  direction_cooldown_sec: 60

  # ATR-based dynamic stops
  use_atr_stops: true
  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 2.0

  # Per-direction loss breaker
  max_dir_consecutive_losses: 3
  dir_cooldown_after_losses_sec: 300

  # Session drawdown
  session_max_drawdown_usd: 20.0
