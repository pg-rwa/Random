# Gold Scalper Configuration v2
# Bollinger Band mean-reversion strategy on 1m candles
# v2: Added trend filter, ATR stops, per-direction loss breaker, kill switch

symbol: "xyz:GOLD"
interval: "1m"
candle_limit: 100
loop_interval_seconds: 60
leverage: 10

# Strategy parameters (Bollinger Band + RSI)
strategy:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30.0        # Only enter on strong oversold
  rsi_overbought: 70.0      # Only enter on strong overbought
  rsi_exit_long: 55.0       # Close long when RSI rises above this
  rsi_exit_short: 45.0      # Close short when RSI drops below this
  band_touch_pct: 0.15      # Entry trigger: price within 15% of band width from band
  min_bb_width_pct: 0.25    # Skip entries when BB width < 0.25% (breakout zone)
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50             # v2: EMA50 for trend direction

  # v2: Trend filter — THE key improvement to stop catching falling knives
  use_trend_filter: true     # ENABLED: skip counter-trend trades
  adx_range_threshold: 25    # ADX < 25 = ranging market (mean-reversion OK both ways)
  adx_trend_threshold: 30    # ADX > 30 = strong trend (only trade WITH trend)
  max_atr_pct: 0.5           # Skip entries when ATR > 0.5% of price (too volatile)
  require_rsi_turn: true     # Require RSI to be turning before entry (not diving deeper)

# Executor parameters (trade sizing & risk)
executor:
  tp_pct: 0.14              # Take profit: 0.14%
  sl_pct: 0.14              # Stop loss: 0.14%
  position_size_usd: 100.0  # Base margin per trade ($100 × 10x = $1000 notional)
  max_consecutive_losses: 5  # Pause after 5 losses in a row (any direction)
  cooldown_after_losses_sec: 300  # 5 min cooldown after global loss streak
  daily_loss_limit_pct: 3.0  # Stop trading if down 3% of equity for the day
  direction_cooldown_sec: 120  # Wait 2 min before re-entering same direction

  # v2: ATR-based dynamic stops — scale with volatility
  use_atr_stops: true         # Use ATR to set SL/TP dynamically
  atr_sl_multiplier: 1.5     # SL = 1.5 × ATR (gives breathing room)
  atr_tp_multiplier: 2.0     # TP = 2.0 × ATR (ensures R:R > 1)

  # v2: Per-direction consecutive loss breaker
  max_dir_consecutive_losses: 3    # Pause a DIRECTION after 3 consecutive losses
  dir_cooldown_after_losses_sec: 600  # 10 min pause per direction

  # v2: Session drawdown protection
  session_max_drawdown_usd: 20.0  # Stop trading if session drops $20 from peak

# Auto-learner — adapts parameters based on trade history
learner:
  enabled: true
  log_dir: "gold_trades"
  lookback_days: 7
  review_every_n_trades: 10        # v2: Review more frequently (was 20)
  min_trades_to_learn: 15          # v2: Start learning sooner (was 30)
  learning_rate: 0.25
  enable_time_filter: true
  enable_direction_filter: true
  enable_tp_sl_tuning: true
  enable_confidence_gate: true
